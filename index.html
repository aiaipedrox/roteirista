<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dark Channel Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>🎬 DARK CHANNEL MANAGER</h1>
            <div class="header-stats">
                <span id="videoCount">0 vídeos</span>
                <span id="channelCount">0 canais</span>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="videos">🎥 PRODUÇÃO</button>
            <button class="tab-btn" data-tab="converter">📝 CONVERSOR SRT</button>
        </nav>

        <!-- Vídeos Tab -->
        <div id="videos-tab" class="tab-content active">
            <div class="section-header">
                <h2>⚡ GERENCIAR PRODUÇÃO</h2>
                <button class="btn btn-primary" id="addVideoBtn">+ CRIAR VÍDEO</button>
            </div>

            <!-- Filtros -->
            <div class="filters">
                <select id="channelFilter" class="input-field">
                    <option value="">📺 TODOS OS CANAIS</option>
                </select>
                <select id="stageFilter" class="input-field">
                    <option value="">🎯 TODOS OS ESTÁGIOS</option>
                    <option value="planejamento">📋 PLANEJAMENTO</option>
                    <option value="producao">🎬 PRODUÇÃO</option>
                    <option value="finalizado">✅ FINALIZADO</option>
                    <option value="postado">🚀 POSTADO</option>
                </select>
            </div>

            <div id="videosList" class="videos-list"></div>

            <!-- Add/Edit Video Modal -->
            <div id="videoModal" class="modal">
                <div class="modal-content modal-large">
                    <h3 id="videoModalTitle">🎬 NOVO VÍDEO</h3>

                    <input type="text" id="videoChannel" placeholder="📺 Nome do Canal" class="input-field" required>

                    <input type="text" id="videoTitle" placeholder="🎯 Título do Vídeo" class="input-field" required>

                    <textarea id="videoDescription" placeholder="📝 Descrição do Vídeo (opcional)" class="input-field" rows="3"></textarea>

                    <textarea id="videoScript" placeholder="📄 Roteiro Completo (opcional)" class="input-field" rows="6"></textarea>

                    <input type="text" id="videoThumbText" placeholder="✨ Texto da Thumbnail (opcional)" class="input-field">

                    <div class="file-upload">
                        <label for="videoThumbFile" class="btn btn-secondary">📷 UPLOAD THUMBNAIL</label>
                        <input type="file" id="videoThumbFile" accept="image/*" style="display: none;">
                        <span id="thumbFileName"></span>
                    </div>

                    <div id="thumbPreview" class="thumb-preview"></div>

                    <div class="checklist">
                        <h4>⚡ CHECKLIST DE PRODUÇÃO</h4>
                        <label class="checkbox-label">
                            <input type="checkbox" id="checkThumb">
                            <span>📷 THUMBNAIL CRIADA</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="checkScript">
                            <span>📝 ROTEIRO PRONTO</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="checkEdit">
                            <span>✂️ EDIÇÃO FINALIZADA</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="checkUpload">
                            <span>☁️ VÍDEO POSTADO</span>
                        </label>
                    </div>

                    <div class="stage-display">
                        <span style="font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: var(--text-secondary);">ESTÁGIO ATUAL: </span>
                        <span id="currentStage" class="stage-badge stage-planejamento">📋 PLANEJAMENTO</span>
                    </div>

                    <div class="modal-actions">
                        <button class="btn btn-secondary" id="cancelVideoBtn">✖ CANCELAR</button>
                        <button class="btn btn-danger" id="deleteVideoBtn" style="display: none;">🗑️ EXCLUIR</button>
                        <button class="btn btn-primary" id="saveVideoBtn">💾 SALVAR</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SRT Converter Tab -->
        <div id="converter-tab" class="tab-content">
            <div class="section-header">
                <h2>🎬 CONVERSOR DE LEGENDAS SRT</h2>
            </div>

            <div class="converter-container">
                <div class="converter-settings">
                    <label>
                        ⏱️ PALAVRAS POR LEGENDA:
                        <input type="number" id="wordsPerSubtitle" value="10" min="1" max="30" class="input-field">
                    </label>
                    <label>
                        ⏰ DURAÇÃO POR LEGENDA (segundos):
                        <input type="number" id="durationPerSubtitle" value="3" min="1" max="10" step="0.5" class="input-field">
                    </label>
                </div>

                <textarea id="textInput" placeholder="Cole seu texto aqui para converter em legendas..." class="input-field converter-input" rows="12"></textarea>

                <div class="converter-stats">
                    <span>📊 PALAVRAS: <strong id="wordCount">0</strong></span>
                    <span>🔤 CARACTERES: <strong id="charCount">0</strong></span>
                    <span>📝 LEGENDAS: <strong id="subtitleCount">0</strong></span>
                </div>

                <button class="btn btn-primary btn-full" id="convertBtn">🔄 CONVERTER PARA SRT (CAPCUT)</button>

                <textarea id="srtOutput" placeholder="Saída em formato SRT compatível com CapCut aparecerá aqui..." class="input-field converter-output" rows="12" readonly></textarea>

                <button class="btn btn-success btn-full" id="downloadSrtBtn" style="display: none;">⬇️ DOWNLOAD ARQUIVO .SRT</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
